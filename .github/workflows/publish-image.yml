name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime UID and GID
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          docker pull "$IMAGE"

          run_identity_check() {
            uid="$1"
            gid="$2"
            root="$RUNNER_TEMP/puid-pgid-$uid-$gid"
            mkdir -p "$root/downloads"
            docker run --rm \
              -e FANBOX_COOKIE=test \
              -e FANBOX_CREATORS=test \
              -e PUID="$uid" \
              -e PGID="$gid" \
              -v "$root/downloads:/data/downloads" \
              "$IMAGE" \
              python -c 'import os; assert (os.getuid(), os.getgid()) == (int(os.environ["PUID"]), int(os.environ["PGID"])); open("/data/downloads/.uid-check", "w").close()'
            test "$(stat -c %u "$root/downloads/.uid-check")" = "$uid"
            test "$(stat -c %g "$root/downloads/.uid-check")" = "$gid"
          }

          run_identity_check 10001 10001
          run_identity_check 3000 3000
          run_identity_check 3000 3001

          if docker run --rm -e PUID=0 -e PGID=3000 "$IMAGE" true; then
            echo "PUID=0 unexpectedly succeeded" >&2
            exit 1
          fi

          if docker run --rm -e PUID=1 -e PGID=3000 "$IMAGE" true; then
            echo "conflicting PUID unexpectedly succeeded" >&2
            exit 1
          fi

          readonly_root="$RUNNER_TEMP/puid-pgid-readonly"
          mkdir -p "$readonly_root/downloads"
          if docker run --rm \
            -e PUID=3000 \
            -e PGID=3000 \
            -v "$readonly_root/downloads:/data/downloads:ro" \
            "$IMAGE" true; then
            echo "read-only mount unexpectedly succeeded" >&2
            exit 1
          fi
